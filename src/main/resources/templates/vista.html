
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOAPLAY</title>
</head>

<body style="margin: 0;">

    <header style="
        background-color: #8A0303;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;">
        DOAPLAY
    </header>

    <nav style="
        background-color: #eeeeee;
        padding: 8px 20px;
        display: flex;
        align-items: center;
        gap: 30px;
        border-bottom: 1px solid #cccccc;
        font-size: 13px;
    ">
        <a href="#" style="color: #333; text-decoration: none;">Quiénes somos</a>

        <a href="#" style="color: #333; text-decoration: none;">Cómo se juega</a>

        <a href="#" style="color: #333; text-decoration: none;">Nueva Partida</a>
    </nav>

    <div style="
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 40px;
        margin-bottom: 15px;">

        <fieldset>
            <legend>DONANTES</legend>

            <label><input type="radio" name="donantes" value="O-"> O−</label><br>
            <label><input type="radio" name="donantes" value="O+"> O+</label><br>
            <label><input type="radio" name="donantes" value="A-"> A−</label><br>
            <label><input type="radio" name="donantes" value="A+"> A+</label><br>
            <label><input type="radio" name="donantes" value="B-"> B−</label><br>
            <label><input type="radio" name="donantes" value="B+"> B+</label><br>
            <label><input type="radio" name="donantes" value="AB-"> AB−</label><br>
            <label><input type="radio" name="donantes" value="AB+"> AB+</label>
        </fieldset>

        <fieldset>
            <legend>PACIENTES</legend>

            <label><input type="radio" name="pacientes" value="O-"> O−</label><br>
            <label><input type="radio" name="pacientes" value="O+"> O+</label><br>
            <label><input type="radio" name="pacientes" value="A-"> A−</label><br>
            <label><input type="radio" name="pacientes" value="A+"> A+</label><br>
            <label><input type="radio" name="pacientes" value="B-"> B−</label><br>
            <label><input type="radio" name="pacientes" value="B+"> B+</label><br>
            <label><input type="radio" name="pacientes" value="AB-"> AB−</label><br>
            <label><input type="radio" name="pacientes" value="AB+"> AB+</label>
        </fieldset>

    </div>

    <div style="text-align: center;">
        <button type="button" style="
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;">
            Emparejar
        </button>
    </div>

    <!-- Barra lateral izquierda -->
    <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 20px;
        height: 100%;
        background-color: #e14949;
        z-index: -1;">
    </div>

    <!-- Barra lateral derecha -->
    <div style="
        position: fixed;
        top: 0;
        right: 0;
        width: 20px;
        height: 100%;
        background-color: #e14949;
        z-index: -1;">
    </div>

</body>
</html>
